name: Build Odds Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/oddslab/analyzer

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OddsAnalyzer"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.oddslab.analyzer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.oddslab.analyzer"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Odds Analyzer">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/oddslab/analyzer/MainActivity.kt <<'EOF'
          package com.oddslab.analyzer

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.View
          import android.webkit.*
          import android.widget.*
          import android.text.InputType
          import android.graphics.Typeface
          import android.view.Gravity
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var url: EditText
              private lateinit var status: TextView
              private lateinit var results: LinearLayout
              private lateinit var web: WebView
              private lateinit var extract: Button

              private val background = Color.rgb(13,18,30)
              private val panel = Color.rgb(27,37,54)
              private val green = Color.rgb(35,160,125)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = background
                  window.navigationBarColor = background

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(18,22,18,12)
                  root.setBackgroundColor(background)

                  root.addView(text("ODDS ANALYZER",24f,Color.WHITE,true))
                  root.addView(text("تحلیل ضرایب مسابقات",16f,Color.LTGRAY,false))

                  url = EditText(this)
                  url.hint = "لینک مسابقه 1xBet"
                  url.setSingleLine(true)
                  url.textSize = 14f
                  url.setTextColor(Color.WHITE)
                  url.setHintTextColor(Color.LTGRAY)
                  url.inputType = InputType.TYPE_TEXT_VARIATION_URI
                  url.setPadding(12,8,12,8)
                  url.setBackgroundColor(panel)

                  root.addView(url, LinearLayout.LayoutParams(-1,55).apply {
                      topMargin = 18
                  })

                  val open = button("باز کردن مسابقه")
                  root.addView(open, LinearLayout.LayoutParams(-1,50).apply {
                      topMargin = 10
                  })

                  status = text("لینک مسابقه را وارد کنید.",14f,Color.LTGRAY,false)
                  root.addView(status)

                  extract = button("استخراج ضرایب")
                  extract.isEnabled = false
                  root.addView(extract, LinearLayout.LayoutParams(-1,50).apply {
                      topMargin = 8
                  })

                  root.addView(text("بازارهای استخراج‌شده",18f,Color.WHITE,true))

                  val scroll = ScrollView(this)
                  results = LinearLayout(this)
                  results.orientation = LinearLayout.VERTICAL
                  scroll.addView(results)

                  root.addView(scroll,LinearLayout.LayoutParams(-1,0,1f))

                  web = WebView(this)
                  web.visibility = View.GONE
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true

                  web.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun send(value: String) {
                          runOnUiThread { showResults(value) }
                      }
                  },"AndroidBridge")

                  web.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, page: String?) {
                          status.text = "مسابقه بارگذاری شد. استخراج ضرایب را بزنید."
                          extract.isEnabled = true
                      }

                      override fun onReceivedError(
                          view: WebView?,
                          request: WebResourceRequest?,
                          error: WebResourceError?
                      ) {
                          status.text = "بارگذاری صفحه ناموفق بود."
                      }
                  }

                  root.addView(web,LinearLayout.LayoutParams(1,1))
                  setContentView(root)

                  open.setOnClickListener { openMatch() }
                  extract.setOnClickListener { extractOdds() }
              }

              private fun text(
                  value:String,
                  size:Float,
                  color:Int,
                  bold:Boolean
              ):TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(null,Typeface.BOLD)
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0,8,0,8)
                  }
              }

              private fun button(value:String):Button {
                  return Button(this).apply {
                      text = value
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      setBackgroundColor(green)
                  }
              }

              private fun openMatch() {
                  var address = url.text.toString().trim()

                  if (address.isEmpty()) {
                      status.text = "ابتدا لینک مسابقه را وارد کنید."
                      return
                  }

                  if (!address.startsWith("https://")) {
                      address = "https://$address"
                  }

                  val host = android.net.Uri.parse(address).host ?: ""

                  if (!host.contains("1xbet",true)) {
                      status.text = "لطفاً لینک معتبر 1xBet وارد کنید."
                      return
                  }

                  extract.isEnabled = false
                  status.text = "در حال بارگذاری مسابقه..."
                  results.removeAllViews()
                  web.loadUrl(address)
              }

              private fun extractOdds() {
                  status.text = "در حال استخراج اطلاعات صفحه..."

                  val script = """
                      (function() {
                          var t = document.body ? document.body.innerText : '';
                          AndroidBridge.send(t.substring(0,100000));
                      })();
                  """.trimIndent()

                  web.evaluateJavascript(script,null)
              }

              private fun showResults(content:String) {
                  results.removeAllViews()

                  val regex = Regex("""(?<![\d.])\d{1,3}\.\d{2,3}(?![\d.])""")
                  var found = 0

                  for (line in content.lines()) {
                      val odds = regex.findAll(line)
                          .mapNotNull { it.value.toDoubleOrNull() }
                          .filter { it in 1.01..1000.0 }
                          .toList()

                      if (odds.isNotEmpty()) {
                          val item = TextView(this)
                          item.text = line.take(220) +
                              "\nضرایب احتمالی: " +
                              odds.joinToString(" | ") {
                                  String.format(Locale.US,"%.2f",it)
                              }
                          item.textSize = 13f
                          item.setTextColor(Color.WHITE)
                          item.setPadding(14,12,14,12)
                          item.setBackgroundColor(panel)

                          results.addView(item,LinearLayout.LayoutParams(-1,-2).apply {
                              bottomMargin = 8
                          })

                          found++
                          if (found >= 100) break
                      }
                  }

                  status.text = if (found == 0) {
                      "ضریب قابل تشخیصی پیدا نشد."
                  } else {
                      "$found ردیف دارای عددهای شبیه ضریب پیدا شد."
                  }

                  val warning = text(
                      "توجه: این نسخه اولیه است. اعداد استخراج‌شده باید با بازار واقعی تطبیق داده شوند. هنوز تحلیل آربیتراژ و ارزش شرط فعال نیست.",
                      12f,
                      Color.YELLOW,
                      false
                  )
                  results.addView(warning)
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Odds-Analyzer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
