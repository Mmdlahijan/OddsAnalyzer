name: Build Odds Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip OddsAnalyzer.zip -d extracted
          ls -la extracted

      - name: Build APK
        working-directory: extracted/odds_analyzer_android_v4
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Odds-Analyzer-APK
          path: extracted/odds_analyzer_android_v4/app/build/outputs/apk/debug/app-debug.apk
