name: Build Odds Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o OddsAnalyzer.zip -d extracted

      - name: Fix Java and Kotlin targets
        run: |
          APP_DIR="extracted/odds_analyzer_android_v4/app"

          if [ -f "$APP_DIR/build.gradle" ]; then
            cat >> "$APP_DIR/build.gradle" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          elif [ -f "$APP_DIR/build.gradle.kts" ]; then
            cat >> "$APP_DIR/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          else
            echo "Gradle file not found"
            exit 1
          fi

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace \
            -p extracted/odds_analyzer_android_v4 assembleDebug

      - name: Find APK
        run: |
          APK=$(find extracted -type f -name "app-debug.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK file not found"
            exit 1
          fi
          cp "$APK" OddsAnalyzer.apk
          ls -lh OddsAnalyzer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Odds-Analyzer-APK
          path: OddsAnalyzer.apk
          if-no-files-found: error
