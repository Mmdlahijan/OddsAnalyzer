name: Build Odds Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o OddsAnalyzer.zip -d extracted
          ls -la extracted/odds_analyzer_android_v4

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace \
            -p extracted/odds_analyzer_android_v4 assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Odds-Analyzer-APK
          path: extracted/odds_analyzer_android_v4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
