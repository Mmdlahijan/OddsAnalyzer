name: Build Odds Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/oddsanalyzer

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OddsAnalyzer"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.oddsanalyzer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.oddsanalyzer"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Odds Analyzer"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/oddsanalyzer/MainActivity.kt <<'EOF'
          package com.oddsanalyzer

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import android.view.ViewGroup

          class MainActivity : Activity() {
              private lateinit var urlInput: EditText
              private lateinit var result: TextView
              private lateinit var browser: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(16, 16, 16, 16)

                  val title = TextView(this)
                  title.text = "Odds Analyzer"
                  title.textSize = 24f
                  layout.addView(title)

                  urlInput = EditText(this)
                  urlInput.hint = "آدرس مسابقه 1xBet را وارد کنید"
                  urlInput.setSingleLine(true)
                  layout.addView(urlInput)

                  val loadButton = Button(this)
                  loadButton.text = "بارگذاری مسابقه"
                  layout.addView(loadButton)

                  val readButton = Button(this)
                  readButton.text = "استخراج اطلاعات و ضرایب"
                  layout.addView(readButton)

                  result = TextView(this)
                  result.text = "آدرس مسابقه را وارد کنید."
                  result.textSize = 15f

                  val scroll = ScrollView(this)
                  scroll.addView(result)
                  layout.addView(scroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1
